[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-exam-assistant"
version = "0.1.0"
description = "Local video/document evidence retrieval and screenshot multiple-choice practice"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
documents = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2"]
video = ["opencv-python-headless>=4.10,<6", "faster-whisper>=1.1,<2"]
ocr = ["rapidocr-onnxruntime>=1.4,<2"]
text = ["sentence-transformers==5.7.0"]
wemm = ["transformers==5.2.0", "qwen-vl-utils==0.0.14", "accelerate>=1.1,<2", "sentence-transformers==5.7.0"]

[project.scripts]
kexam = "kexam.cli:main"

[tool.setuptools.package-data]
kexam = ["templates/*.html"]
