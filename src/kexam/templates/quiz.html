<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图答题 · 课程知识库</title><style>
:root{font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif;color:#213c31;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px 24px 80px}nav{display:flex;gap:22px;font-size:14px}a{color:#246647}header{margin:30px 0 24px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:22px;margin:0 0 12px}h3{font-size:17px}p{margin:8px 0}.muted{color:#69796e;font-size:14px}.panel{background:#fff;border:1px solid #dbe3d6;border-radius:14px;padding:24px;margin:18px 0}.drop{border:2px dashed #b3c6ac;background:#f8fbf5;padding:28px;text-align:center;border-radius:10px;outline-offset:4px}.drop:focus{outline:3px solid #9db98e}.drop strong{display:block;font-size:20px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}button,select{font:inherit;padding:9px 16px;border:1px solid #bccdb5;background:white;color:inherit;border-radius:8px}button{cursor:pointer}button.primary{background:#24533c;color:white;border-color:#24533c}button:disabled{opacity:.5;cursor:not-allowed}.previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:20px}.preview img{width:100%;height:135px;object-fit:contain;border:1px solid #dbe3d6;border-radius:7px}.preview button{font-size:12px;padding:3px 9px}.preview p{font-size:13px}.status{color:#426541;margin-top:15px}.error{color:#9b3927}.resultheader{display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{font-size:13px;padding:5px 11px;border-radius:18px;background:#e7f1df}.review{background:#fff0cc;color:#74560c}.answer{font-size:25px;font-weight:650;margin:16px 0 8px}.reason{white-space:pre-wrap}.option{padding:11px 0;border-bottom:1px solid #edf0e9}.sources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.source{min-width:0;padding:14px;background:#f7f9f4;border-radius:8px;font-size:14px}.source img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block}.source p{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}.source pre{white-space:pre-wrap;font:inherit}summary{cursor:pointer;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.note{background:#edf3e7;padding:12px 15px;border-radius:8px;font-size:14px}#exports a{margin-left:16px}@media(max-width:680px){main{padding:20px 14px}.panel{padding:17px}.sources{grid-template-columns:1fr}.resultheader{align-items:start}h1{font-size:28px}}
</style></head><body><main>
<nav><a href="/">PPT 与原文检索</a><a href="/handbook">知识文档</a></nav>
<header><h1>截图答题</h1><p class="muted">粘贴题目，自动寻找课程依据。每题展示建议答案、选项判断和相关 PPT。</p></header>
<section class="panel"><div id="drop" class="drop" tabindex="0" role="region" aria-label="粘贴题目截图区域"><strong>点击这里，Ctrl + V 粘贴截图</strong><p>可连续粘贴或一次选择多张图片。每批最多 100 张、压缩后合计 64 MiB，每张最多 5 道题。</p><button id="pick">选择截图</button><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></div>
<div id="previews" class="previews"></div><div class="actions"><label for="course">课程范围</label><select id="course"><option value="">全部课程</option></select><label for="concurrency">并发数</label><input id="concurrency" type="number" min="1" max="8" step="1" value="3" style="font:inherit;padding:9px;width:90px;border:1px solid #bccdb5;border-radius:8px"><button class="primary" id="submit" disabled>开始识别与答题</button><button id="clear">清空截图</button></div>
<label style="display:flex;gap:8px;align-items:center;margin-top:15px"><input type="checkbox" id="allowInference" checked>课程证据不足时，另外给出模型推断候选</label><p id="status" class="status" role="status" aria-live="polite">正在连接…</p><p class="note">提交后，题图、相关课程截图和文字会发送给配置的外部模型。AI 建议不保证正确；已有勾选不作为答案；作答后会再次复核否定词和证据逻辑。模型推断会单独标记“无充分课程依据”，不会冒充课程确认答案。按设定并发数持续补位处理，先完成的题先展示；单题失败不影响其他题目。</p></section>
<div class="resultheader"><h2 id="progress">答题结果</h2><div id="exports" hidden></div></div><nav id="questionNav" aria-label="题目导航" style="display:flex;flex-wrap:wrap;gap:14px;margin:14px 0"></nav><div id="results"><p class="muted">提交后会在这里显示识别文字、参考答案和课程证据。</p></div>
</main><script>
'use strict';
const TOKEN='__TOKEN__', $=id=>document.getElementById(id);let images=[],busy=false,configured=false,jobId=new URLSearchParams(location.search).get('job')||sessionStorage.getItem('quizJob'),selectionChain=Promise.resolve(),anchorShown=false;
const node=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
function status(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'')}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Course-Token':TOKEN},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function buttons(){$('submit').disabled=busy||!configured||!images.length;$('clear').disabled=busy;$('pick').disabled=busy;$('concurrency').disabled=busy}
function previews(){$('previews').replaceChildren();images.forEach((r,i)=>{const card=node('div',undefined,'preview');const img=node('img');img.src=r.data_url;img.alt='待提交题图 '+(i+1);const remove=node('button','移除');remove.disabled=busy;remove.onclick=()=>{images.splice(i,1);previews()};card.append(img,node('p',`${i+1}. ${r.name}`),remove);$('previews').append(card)});buttons()}
async function addFiles(files){if(busy){status('当前批次仍在处理，请稍后添加截图。',true);return}let added=0;for(const file of files){if(!file.type.startsWith('image/'))continue;if(images.length>=100){status('每批最多 100 张；请先提交当前批次。',true);break}if(file.size>20*1024*1024){status('原始图片超过 20 MiB，请缩小后重试。',true);continue}const object=URL.createObjectURL(file);try{const img=new Image();img.src=object;await img.decode();if(img.width*img.height>40000000)throw Error('图片尺寸过大');const scale=Math.min(1,2200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.93);if(data.length>5.5*1024*1024)throw Error('图片压缩后仍过大');const total=images.reduce((sum,r)=>sum+r.data_url.length,0)+data.length;if(total>64*1024*1024*4/3)throw Error('本批图片合计超过 64 MiB，请分批提交');images.push({name:file.name||'粘贴截图',data_url:data});added++}catch(e){status('图片读取失败：'+e.message,true)}finally{URL.revokeObjectURL(object)}}previews();if(added)status(`已添加 ${images.length}/100 张截图；请确认题干和选项完整。`)}
function queueFiles(files){selectionChain=selectionChain.then(()=>addFiles(files)).catch(e=>status(e.message,true))}
$('pick').onclick=()=>$('files').click();$('files').onchange=e=>{queueFiles(Array.from(e.target.files));e.target.value=''};
document.addEventListener('paste',e=>{const files=Array.from(e.clipboardData.items).filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();queueFiles(files)}});
$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();queueFiles(Array.from(e.dataTransfer.files))};$('clear').onclick=()=>{images=[];previews()};
function sourceCard(r){const box=node('div',undefined,'source');box.append(node('strong',r.id+' · '+(r.course||r.chapter_title||'课程资料')));if(r.image){const url='/files/'+r.image.split('/').map(encodeURIComponent).join('/');const a=node('a');a.href=url;a.target='_blank';a.rel='noopener';const img=node('img');img.src=url;img.loading='lazy';img.alt='课程证据 '+r.id;a.append(img);box.append(a)}box.append(node('p',(r.text||r.ocr_text||'').slice(0,2200)));if(r.handbook_url||r.watch_url){const a=node('a',r.handbook_url?'阅读讲义原段落':'回看课程讲解');a.href=r.handbook_url||r.watch_url;a.target='_blank';a.rel='noopener';box.append(a)}return box}
function render(job){
 $('results').replaceChildren();const questionNav=$('questionNav');questionNav.replaceChildren();
 const done=job.items.filter(i=>['complete','failed'].includes(i.status)).length;
 $('progress').textContent=`答题结果 · ${done}/${job.items.length}`;
 for(const item of job.items){
  const panel=node('article',undefined,'panel');panel.id='question-'+item.index;
  const jump=node('a',item.question?.number?'原题 '+item.question.number:'第 '+item.index+' 题');jump.href='#question-'+item.index;questionNav.append(jump);
  const head=node('div',undefined,'resultheader');head.append(node('h2','第 '+item.index+' 题'+(item.question?.number?' · 原题 '+item.question.number:'')+(item.source_image?' · 图 '+item.source_image:'')));
  const a=item.answer, inference=a?.inference;
  const badge=inference?.selected.length?'模型推断 · 无充分课程依据':a?(a.status==='supported'?'有课程依据 · 请核对':'需复核'):item.status==='failed'?'本题未完成':item.message||'等待处理';
  head.append(node('span',badge,'badge'+(a?.status!=='supported'?' review':'')));panel.append(head);
  if(item.question){const q=item.question;panel.append(node('p',q.stem),node('p',q.type==='single'?'单选题':q.type==='multiple'?'多选题':'题型不明，请复核','muted'));const t=node('details');t.append(node('summary','核对题干、选项与检索词'),node('pre',q.options.map(o=>o.label+'. '+o.text).join('\n')+'\n检索词：'+q.keywords.join('、')));panel.append(t)}
  if(a){
   const shown=inference||a;
   panel.append(node('p',(inference?'模型推断候选：':a.status==='supported'?'建议选项：':'待复核候选：')+(shown.selected.join('、')||'暂不作答'),'answer'));
   if(inference)panel.append(node('p','无充分课程依据；以下为模型一般知识与题目语义推断，需人工核对。','note review'));
   panel.append(node('p',shown.reason,'reason'));
   if(!inference)panel.append(node('p','引用：'+(a.citations.join('、')||'无'),'muted'));
   for(const o of shown.options){const words=inference?{correct:'推断倾向勾选',incorrect:'推断倾向不选',uncertain:'不确定'}:{correct:'应勾选',incorrect:'不勾选',uncertain:'不确定'};panel.append(node('div',o.label+' · '+words[o.verdict]+'：'+o.reason,'option'))}
   if(inference){const audit=node('details');audit.append(node('summary','课程证据为什么不足？'),node('p',a.reason),node('p','审核过的材料编号（不代表已证明推断）：'+(a.citations.join('、')||'无'),'muted'));panel.append(audit)}
   if(a.inference_error)panel.append(node('p','模型推断未完成：'+a.inference_error,'error'));
  }else panel.append(node('p',item.message||'等待处理',item.status==='failed'?'error':'muted'));
  if(item.evidence?.length){
   const details=node('details');details.append(node('summary',`查看检索材料（${item.evidence.length} 条）`));
   if(a){const main=node('div',undefined,'sources');for(const kind of ['ppt','handbook']){const candidates=item.evidence.filter(r=>r.kind===kind);const row=candidates.find(r=>a.citations.includes(r.id))||candidates[0];if(row)main.append(sourceCard(row))}panel.append(node('h3',inference?'相关检索材料（未充分支持候选答案）':'主要课程依据'),main)}
   const grid=node('div',undefined,'sources');item.evidence.forEach(r=>grid.append(sourceCard(r)));details.append(grid);panel.append(details);
  }
  $('results').append(panel);
 }
 $('exports').hidden=false;$('exports').replaceChildren();for(const ext of ['md','json']){const a=node('a',ext==='md'?'导出 Markdown':'导出 JSON');a.href='/quiz/export/'+job.id+'.'+ext;a.target='_blank';a.rel='noopener';$('exports').append(a)}
 if(!anchorShown&&location.hash){const target=document.getElementById(location.hash.slice(1));if(target){requestAnimationFrame(()=>target.scrollIntoView({block:'start'}));anchorShown=true}}
}
async function poll(){if(!jobId)return;try{const job=await api('/api/quiz/jobs/'+jobId);render(job);busy=job.status==='running';buttons();if(busy){status(`并发 ${job.question_concurrency||1} 路处理中，空闲名额自动补位。离开页面不会中止批次。`);setTimeout(poll,2000)}else{status(job.status==='interrupted'?job.message:'批次处理结束；请核对每题状态、识别文字和课程依据。',job.status==='interrupted');sessionStorage.removeItem('quizJob')}}catch(e){status('查询进度失败：'+e.message+'；稍后重试。',true);setTimeout(poll,5000)}}
$('submit').onclick=async()=>{await selectionChain;busy=true;previews();try{const concurrency=Number($('concurrency').value);if(!Number.isInteger(concurrency)||concurrency<1||concurrency>8)throw Error('并发数请填写 1–8 的整数');const r=await api('/api/quiz/submit',{images,concurrency,course:$('course').value,allow_inference:$('allowInference').checked});jobId=r.id;history.replaceState(null,'','/quiz?job='+jobId);sessionStorage.setItem('quizJob',jobId);poll()}catch(e){busy=false;previews();status(e.message,true)}};
async function init(){try{const s=await api('/api/quiz/status');configured=s.configured;$('concurrency').value=s.question_concurrency||3;status(configured?'视觉模型：'+s.model+'。可粘贴截图开始。':s.message,!configured);const courses=await api('/api/courses');for(const c of courses){const o=node('option',c.name.replace(/\.mp4$/i,''));o.value=c.id;$('course').append(o)}buttons();if(jobId){busy=true;poll()}}catch(e){status(e.message,true)}}init();
</script></body></html>
